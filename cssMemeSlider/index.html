<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meme Slider</title>
    <link rel="stylesheet" href ="style.css">
</head>
<body>
    <div class="main-container">
        <input type="radio" name="slider" id="slide1" checked>
        <input type="radio" name="slider" id="slide2">
        <input type="radio" name="slider" id="slide3">
        <input type="radio" name="slider" id="slide4">
        <div class="slider">
            <div class="slides">
                <div class="slide">
                    <img src="assets/img1.webp" alt="Chill Guy meme">
                </div>
                <div class="slide">
                    <img src="assets/img2.webp" alt="Legacy code meme">
                </div>
                <div class="slide">
                    <img src="assets/img3.webp" alt="Programs">
                </div>
                <div class="slide">
                    <img src="assets/img4.webp" alt="Programmer's routine meme">
                </div>
            </div>
        </div>
        <div class="bot-container">
            <div class="descriptions">
                <div class="descriptions-wrapper">
                    <p class="description" id="desc1">Chill Guy</p>
                    <p class="description" id="desc2">Legacy code</p>
                    <p class="description" id="desc3">Programs</p>
                    <p class="description" id="desc4">Programmer's routine</p>
                </div>
            </div>
            <div class="buttons">
                <label for="slide1"></label>
                <label for="slide2"></label>
                <label for="slide3"></label>
                <label for="slide4"></label>
            </div>
        </div>
    </div>
</body>
</html>
