<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meme Slider</title>
    <link rel="stylesheet" href ="style.css">
</head>
<body>
    <div class="main-container">
        <input type="radio" name="slider" id="slide1" checked>
        <input type="radio" name="slider" id="slide2">
        <input type="radio" name="slider" id="slide3">
        <input type="radio" name="slider" id="slide4">
        <div class="slider">
            <div class="slides">
                <div class="slide">
                    <img src="assets/img1.jpg" alt="My code, my rules">
                </div>
                <div class="slide">
                    <img src="assets/img2.jpg" alt="Debugging experience in one picture">
                </div>
                <div class="slide">
                    <img src="assets/img3.jpg" alt="It really worked, honest.">
                </div>
                <div class="slide">
                    <img src="assets/img4.jpg" alt="Peak programming">
                </div>
            </div>
        </div>
        <div class="bot-container">
            <div class="descriptions">
                <div class="descriptions-wrapper">
                    <p class="description" id="desc1">My code, my rules</p>
                    <p class="description" id="desc2">Debugging experience in one picture</p>
                    <p class="description" id="desc3">It really worked, honest.</p>
                    <p class="description" id="desc4">Peak programming</p>
                </div>
            </div>
            <div class="buttons">
                <label for="slide1"></label>
                <label for="slide2"></label>
                <label for="slide3"></label>
                <label for="slide4"></label>
            </div>
        </div>
    </div>
</body>
</html>
